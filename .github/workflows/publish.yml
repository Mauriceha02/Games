name: Publish versioned Phase10

on:
  push:
    branches: [Dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/Dev'
    env:
      PHASE10_RELEASE_NUMBER: ${{ github.run_number }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Read pinned Gruselino version
        id: gruselino
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const {gruselino}=JSON.parse(readFileSync("games.json","utf8")); if(gruselino.repository!=="Mauriceha02/Gruselino" || !/^[a-f0-9]{40}$/.test(gruselino.revision)) throw new Error("Invalid Gruselino version"); process.stdout.write("revision="+gruselino.revision+"\n");' >> "$GITHUB_OUTPUT"

      - name: Check out pinned Gruselino source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Mauriceha02/Gruselino
          ref: ${{ steps.gruselino.outputs.revision }}
          path: .cache/gruselino
          persist-credentials: false

      - name: Read pinned multiplayer version
        id: multiplayer
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const config=JSON.parse(readFileSync(".cache/gruselino/multiplayer.json","utf8")); if(config.repository!=="Mauriceha02/Game-Multiplayer" || !/^[a-f0-9]{40}$/.test(config.revision)) throw new Error("Invalid multiplayer version"); process.stdout.write("revision="+config.revision+"\n");' >> "$GITHUB_OUTPUT"

      - name: Check out multiplayer source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Mauriceha02/Game-Multiplayer
          ref: ${{ steps.multiplayer.outputs.revision }}
          path: .cache/multiplayer
          persist-credentials: false

      - name: Install multiplayer dependencies
        working-directory: .cache/multiplayer
        run: npm ci --ignore-scripts

      - name: Install Gruselino dependencies
        working-directory: .cache/gruselino
        run: npm ci --ignore-scripts

      - name: Build and test the game
        env:
          GRUSELINO_SOURCE: ${{ github.workspace }}/.cache/gruselino
          MULTIPLAYER_SOURCE: ${{ github.workspace }}/.cache/multiplayer
        run: npm test

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/Dev'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload the website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/Dev'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/Dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
